name: Push Dist to Branch
on:
  push:
    tags:
      - 'v*' # Trigger on version tags

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, dframework-runner]
    timeout-minutes: 30
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js and pinned Yarn
        uses: durlabhjain/dframework-node/.github/actions/setup-yarn@5b0f4e81f8ac367e859ac8e8ab758504d8efc3ff
        with:
          node-version: '24.21.0'
          vp-version: '1.3.0'

      - name: Build
        run: |
          yarn instructions:check
          yarn check
          yarn test
          yarn build

      - name: Prepare distribution manifest
        # Writes a minimal package.json into dist/ instead of copying the source
        # one verbatim. The source package.json carries devDependencies and a
        # "prepare": "vp config --no-agent" script for local development; shipping those as-is
        # breaks installs when this branch is consumed as a git dependency,
        # since the hook setup can fail when it can't find a .git directory
        # in the temp clone yarn/npm use, aborting the dependency's install
        # before its build output gets linked into node_modules.
        run: |
          node -e "
            const pkg = require('./package.json');
            const distPkg = {
              name: pkg.name,
              version: pkg.version,
              private: pkg.private,
              type: pkg.type,
              main: pkg.main,
              module: pkg.module,
              exports: pkg.exports,
              peerDependencies: pkg.peerDependencies
            };
            require('fs').writeFileSync('dist/package.json', JSON.stringify(distPkg, null, 2) + '\n');
          "

      - name: Deploy to Dist Branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: dist-release
          folder: dist
          clean: true
          # This creates a unique tag on the dist-release branch
          tag: dist-${{ github.ref_name }}
