name: Push Dist to Branch
on:
  push:
    tags:
      - 'v*' # Trigger on version tags

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, dframework-runner]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Build
        run: |
          npm install
          npm run build

      - name: Prepare Dist for NPM
        # Writes a minimal package.json into dist/ instead of copying the source
        # one verbatim. The source package.json carries devDependencies and a
        # "prepare": "husky" script for local development; shipping those as-is
        # breaks installs when this branch is consumed as a git dependency,
        # since husky's prepare step fails when it can't find a .git directory
        # in the temp clone yarn/npm use, aborting the dependency's install
        # before its build output gets linked into node_modules.
        run: |
          node -e "
            const pkg = require('./package.json');
            const distPkg = {
              name: pkg.name,
              version: pkg.version,
              private: pkg.private,
              type: pkg.type,
              main: pkg.main,
              module: pkg.module,
              exports: pkg.exports,
              peerDependencies: pkg.peerDependencies
            };
            require('fs').writeFileSync('dist/package.json', JSON.stringify(distPkg, null, 2) + '\n');
          "

      - name: Deploy to Dist Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: dist-release
          folder: dist
          clean: true
          # This creates a unique tag on the dist-release branch
          tag: dist-${{ github.ref_name }}
