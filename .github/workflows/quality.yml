name: Dependency and UI Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install committed dependencies
        run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
