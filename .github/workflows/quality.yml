name: Dependency and UI Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: durlabhjain/dframework-node/.github/actions/setup-yarn@5b0f4e81f8ac367e859ac8e8ab758504d8efc3ff
        with:
          node-version: '24.21.0'
          vp-version: '1.3.0'
      - name: Check generated agent instructions
        run: yarn instructions:check
      - run: yarn check
      - run: yarn test
      - run: yarn build
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- yarn.lock
