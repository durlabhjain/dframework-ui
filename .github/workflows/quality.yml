name: Dependency and UI Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24.21.0'
          run-install: false
      - name: Install committed dependencies
        run: yarn install --immutable
      - run: yarn check
      - run: yarn test
      - run: yarn build
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- yarn.lock
